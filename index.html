    <style>
        /* 基礎頁面樣式，讓手機框置中 */
         body {
            margin: 0;
            padding: 0;
    
        /* 1. 關鍵組合：底色（白色）+ 你的背景圖片 */
            background-image: 
            linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), /* 👈 第一層：半透明白色濾鏡（0.5代表50%變淡，數字越大背景越白越淡） */
            url('website-bg.png'); /* 👈 第二層：你的橫幅背景圖片檔名 */
        
            background-size: cover;                 /* 自動鋪滿全螢幕 */
    
        /* 2. 關鍵修改：將置中(center)改成靠右(right)，把被擋住的人臉往右邊推 */
            background-position: right center;      
    
            background-repeat: no-repeat;            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 模擬手機外框 */
        .phone-container {
            position: relative;
            width: 390px; 
            height: 844px; 
            border: 13px solid #333; /* 💡 可以在這裡修改手機外框顏色 */
            border-radius: 40px;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 💡 終極完美版：空心平移技術，百分之百精準壓在 13px 手機框上 */
        .phone-container::after {
            content: "";
            position: absolute;
            
            /* 1. 💡 關鍵平移：因為你手機框是 13px，我們將反光膜往外推 13px，精準對齊邊框外緣 */
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            
            /* 2. 完美的圓角貼合 */
            border-radius: 40px; 
            
            /* 3. 💡 設定成跟你手機框完全一樣的 13px 粗細 */
            border: 13px solid transparent; 
            
            /* 4. 💡 核心魔法：利用向內刷的內陰影（inset），它會百分之百強行刷在這層空心膜上，完美覆蓋你的手機殼！ */
            box-shadow: 
                inset 5px 5px 10px rgba(255, 255, 255, 0.5),   /* 左上角：強烈金屬高光（白光） */
                inset -5px -5px 10px rgba(0, 0, 0, 0.5),       /* 右下角：金屬深色陰影（黑影） */
                inset -2px -2px 4px rgba(255, 255, 255, 0.3),  /* 輔助右下亮邊 */
                inset 2px 2px 4px rgba(0, 0, 0, 0.4);          /* 輔助左上暗邊 */
                
            /* 5. 確保層級絕對在最上層（高於手機底色和內部圖片） */
            z-index: 25; 
            
            /* 6. 保持滑鼠點擊穿透，完全不影響你之前對準好的任何按鈕 */
            pointer-events: none; 
        }

        /* 瀏海 / 動態島效果 */
        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: black;
            border-radius: 15px;
            z-index: 20;
        }

        /* ----------------------------------
           1. 鎖定畫面 (Lock Screen)
        ------------------------------------- */
        .lock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('lockscreen.png'); /* 💡 鎖定畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 15;
            transition: opacity 0.5s ease, transform 0.5s ease; /* 解鎖時的淡出動畫 */
        }

        /* 當解鎖時，鎖定畫面會變透明並往上滑開 */
        .lock-screen.unlocked {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none; /* 讓它失去點擊功能，才點得到底下的主畫面 */
        }

        /* 鎖定畫面左下角的蘋果點擊熱區 */
        .apple-unlock-btn {
            position: absolute;
            bottom: 5.5%;
            left: 11.4%;
            width: 13%;
            height: 6%;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 50%;
            cursor: pointer;
            z-index: 16;
        }

        /* 📸 新增：右下角相機點擊熱區（維持與解鎖蘋果按鈕對稱） */
        .camera-btn {
            position: absolute;
            bottom: 5.5%;
            right: 11.4%;
            width: 13%;
            height: 6%;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 50%;
            cursor: pointer;
            z-index: 16;
        }

        /* 💬 新增：鎖定畫面底部的彈出通知訊息框（🌸 完美還原主畫面輕透質感版） */
        #bottom-toast {
            position: absolute;
            bottom: -60px;      /* 預設藏在手機畫面底部的外面 */
            left: 50%;
            transform: translateX(-50%); /* 橫向置中 */
            
            /* 🌸 核心修正：跟主畫面通知完全相同的 0.35 輕透半透明白，不會太白也不會太毛 */
            background-color: rgba(255, 255, 255, 0.55); 
            
            /* ✨ 核心修正：跟主畫面通知完全相同的 10px 蘋果毛玻璃模糊特效 */
            backdrop-filter: blur(10px);                 
            -webkit-backdrop-filter: blur(10px);
            
            /* 🎨 核心修正：跟主畫面通知完全相同的深灰色字體，看得清楚又高級 */
            color: #000000;                              
            
            /* 加上與主畫面通知相同的極細微白邊框 */
            border: 1px solid rgba(255, 255, 255, 0.2); 
            
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 18px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.2); /* 與主畫面相同的柔和陰影 */
            z-index: 30; 
            display: flex;
            align-items: center;
            font-size: 14px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-weight: bold;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 從 top 改成 bottom 的滑動效果 */
            white-space: nowrap;
        }

        /* 當通知被激活從底部滑上來時 */
        #bottom-toast.show {
            bottom: 120px; /* 滑動到畫面底部上方的位置 */
        }

        /* 🚫 終極修正：只要鎖定畫面被加上了 unlocked，就把這兩個元件強行變不見！ */
        .unlocked .camera-btn,
        .unlocked ~ .camera-btn,
        .lock-screen.unlocked .camera-btn {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .unlocked #bottom-toast,
        .unlocked ~ #bottom-toast,
        .lock-screen.unlocked #bottom-toast {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }



        /* ----------------------------------
           2. 主畫面 (Home Screen)
        ------------------------------------- */
        .home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('homescreen.png'); /* 💡 主畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 5;
        }

        /* 主畫面點擊熱區的通用樣式 */
        .clickable-icon {
            position: absolute;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .clickable-icon:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 主畫面的 Icon 定位 (保持原本的設定) */
        .icon-star { top: 7.7%; left: 8.5%; width: 15%; height: 7.2%; }
        .icon-caleb { top: 7.7%; left: 31.5%; width: 15%; height: 7.2%; }
        .icon-calendar { top: 18.8%; left: 8.5%; width: 15%; height: 7.3%; }
        .icon-apple-red { top: 18.8%; left: 31.5%; width: 15%; height: 7.3%; }
        .icon-apple-green { top: 30.5%; left: 31.5%; width: 15%; height: 7.3%; }
        .widget-top-right { top: 7.7%; left: 54%; width: 38%; height: 18.5%; border-radius: 20px; }
        .widget-bottom-left { top: 55.7%; left: 8.5%; width: 38%; height: 18.7%; border-radius: 20px; }
        .dock-orange { bottom: 3.8%; left: 19.7%; width: 15.1%; height: 7%; }
        .dock-red { bottom: 3.8%; left: 42.5%; width: 15.1%; height: 7%; }
        .dock-green { bottom: 3.8%; left: 65.5%; width: 15.1%; height: 7%; }

        /* ----------------------------------
           3. 💡 新增：獨立的大圖畫面層 (Gallery Screen)
        ------------------------------------- */
        .gallery-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 高於主畫面桌面，低於動態島和金屬外殼 */
            opacity: 0;
            transform: translateY(100%); /* 預設在手機下方，準備往上滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        /* 當大圖畫面被打開時（模仿解鎖切換感） */
        .gallery-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 大圖畫面的圓形返回鍵 (✕) */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            width: 38px;
            height: 38px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        /* 大圖畫面的圓形返回鍵 (✕) - 💡 調整為更小、更淡 */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            
            /* 📐 1. 調整大小：原本 38px，縮小為 28px */
            width: 28px;
            height: 28px;
            
            /* 🎨 2. 調整顏色與淡度：原本 0.6，調淡為 0.35 的極輕透半透明黑 */
            background-color: rgba(0, 0, 0, 0.35);
            
            color: rgba(255, 255, 255, 0.8); /* 讓叉叉文字也帶有一點透明度 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            
            /* 📐 3. 調整字型大小：配合按鈕縮小，文字從 18px 縮小為 14px */
            font-size: 14px;
            
            font-weight: bold;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.2); /* 讓陰影也隨之變淡 */
            transition: background 0.2s, opacity 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        
        /* 滑鼠移上去時稍微變明顯（增強互動感） */
        .gallery-back-btn:hover {
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .gallery-back-btn:active {
            transform: scale(0.9);
        }

        /* 💡 新增：日曆專屬的大圖畫面層 */
        .calendar-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 跟原本相簿大圖同層 */
            opacity: 0;
            transform: translateY(100%); /* 預設在下方準備滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        /* 當日曆大圖被打開時 */
        .calendar-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 【修正：高質感半透明版】手機模擬通知訊息框 */
        .phone-notification {
            position: absolute;
            top: -100px; 
            left: 5%;
            width: 90%;
            
            /* 🌸 核心修正：將透明度調低為 0.35 的輕透半透明白，完美露出底下的桌面與Icon */
            background-color: rgba(255, 255, 255, 0.35); 
            
            /* ✨ 保留並加強蘋果系統的毛玻璃效果，讓透過去的背景帶有朦朧美 */
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); /* 確保蘋果 iOS 手機瀏覽器也能完美呈現 */
            
            /* 🎨 核心修正：深灰色字體 */
            color: #3a3a3a;
            border: 1px solid rgba(255, 255, 255, 0.2); /* 加上極細的透明白邊框，增加立體感 */
            
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 18px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.2); /* 稍微加深陰影，讓透明氣泡更浮現 */
            z-index: 30; 
            display: flex;
            align-items: center;
            font-size: 14px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-weight: bold;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        
        /* 當通知被激活動態滑下來時 */
        .phone-notification.show {
            top: 60px; /* 滑動到動態島下方的位置 */
        }

        /* 通知內的小系統圖示 */
        .noti-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        /* ================= 💡 新增：音樂控制區與跑馬燈樣式 ================= */
        .music-control-box {
            position: fixed; 
            top: 25px;       
            right: 25px;     
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;    
            background-color: rgba(0, 0, 0, 0.45); 
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px); 
            width: 200px; 
            overflow: hidden;
            opacity: 0.65;   
            transition: opacity 0.3s ease, transform 0.3s ease;
            
            /* 💡 新增這行：讓滑鼠移到整個跑馬燈區塊時，都會變成可以點擊的小手 */
            cursor: pointer; 
        }
        .music-control-box:hover {
            opacity: 1; /* 滑鼠移上去時變清晰 */
        }

        /* 跑馬燈可視外框 */
        .marquee-wrapper {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            width: 100px; /* 固定跑馬燈寬度 */
        }

        /* 跑馬燈文字本體與無限滾動動畫 */
        .marquee-text {
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            font-weight: bold;
            padding-left: 100%; /* 從最右側外面開始滑入 */
            animation: marqueeEffect 10s linear infinite;
        }

        /* 跑馬燈動畫軌跡：從右到左無限循環 */
        @keyframes marqueeEffect {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* 喇叭按鈕樣式 */
        .music-icon-btn {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
            color: #ffffff;
        }
        .music-icon-btn:active {
            transform: scale(0.85); /* 點擊時縮放回饋 */
        }

        /* ============================================================ */
        /* 1. CSS 樣式：雙層巢狀便利貼系統（完美還原最初版本）             */
        /* ============================================================ */
        
        /* 【全螢幕黑色半透明遮罩】用來把底下的手機主畫面變暗與模糊 */
        .sticky-wall-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65); /* 65%透明度的黑底 */
            backdrop-filter: blur(8px);           /* 蘋果毛玻璃模糊特效 */
            z-index: 40;                          /* 確保蓋在桌面圖示上 */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;                           /* 預設隱形 */
            pointer-events: none;                 /* 預設不可點擊，防止擋到桌面 */
            transition: opacity 0.4s ease;        /* 0.4秒平滑淡入動畫 */
        }
        
        /* 當 JavaScript 幫忙加上 .show 類別時就會顯示出來 */
        .sticky-wall-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 【第一層】半透明毛玻璃色塊主容器（還原最初版） */
        .sticky-wall-container {
            width: 88%;
            max-height: 75%;          /* 🌸 修正：換回最原始的 max-height，拒絕高度被鎖死 */
            background-color: rgba(255, 255, 255, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 10px 30px 30px 30px;         /* 🌸 修正：換回原本最完美的 20px 內襯留白 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;                 /* 🌸 修正：換回原本最舒服的 15px 元件間距 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* 標題與右上角 (×) 關閉按鈕的排版 */
        .sticky-wall-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        /* 【修正：白色半透明正確版】便利貼牆右上角的關閉按鈕 (✕) */
        .sticky-close-btn {
            width: 28px;              /* 鎖定 28px 寬 */
            height: 28px;             /* 鎖定 28px 高 */
            background-color: rgba(255, 255, 255, 0.25); 
            color: #ffffff;
            border-radius: 50%;       /* 完美的正圓形 */
            
            /* ⚡ 核心大絕招：強制按鈕內部的「x」字母在圓圈裡絕對水平、垂直雙置中 */
            display: block;           /* 改為塊級元件以精準套用行高 */
            line-height: 28px;        /* 💡 行高必須跟按鈕高度 28px 完全一樣，字體就會完美垂直置中 */
            text-align: center;       /* 💡 讓字體完美水平置中 */
            
            font-size: 16px;          
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            
            /* ⚡ 核心防護：強行鎖定尺寸！不論旁邊的標題多長，都絕對不允許被擠壓變扁 */
            flex-shrink: 0; 
        }
        .sticky-close-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }


        /* 便利貼內部佈局網格 */
        .sticky-notes-grid {
            display: grid;

            border-bottom-right-radius: 15px 3px; 
        }

        
        /* 💡 新增：四張便利貼時，各自獨立指派【黃、橘、粉、紫】四色與傾斜角度 */
        
        /* 🟡 第 1 張便利貼：原本的粉黃色（往左微傾斜） */
        .sticky-note-card:nth-child(4n+1) {
            background-color: #fff6c0; 
            transform: rotate(-1.5deg);
        }
        
        /* 🟠 第 2 張便利貼：原本的粉橘色（往右微傾斜） */
        .sticky-note-card:nth-child(4n+2) {

            transform: rotate(2deg);

        /* 🌸 第 3 張便利貼：新增的浪漫粉紅色（往左微傾斜） */
        .sticky-note-card:nth-child(4n+3) {
            background-color: #ffe9e9; /* 柔和粉紅色 */
            transform: rotate(-2.5deg); /* 微調傾斜度，看起來更自然不呆板 */
        }
        
        /* 🍇 第 4 張便利貼：新增的夢幻藍（往右微傾斜） */
        .sticky-note-card:nth-child(4n+4) {
            background-color: #e1f1ff; /* 柔和藍色 */
            transform: rotate(1.5deg);
        }

        
        /* 滑鼠懸停時微放大、立正，並加深陰影 */
        .sticky-note-card:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.25);

        }

          /* 【第二層】滿版展示大圖畫面層（💡 適應型：自動縮放不切圖） */
        .sticky-gallery-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* 📐 核心魔法：從 cover 改成 contain，照片會自動縮小到「完全看得見整張圖」為止 */
            background-size: contain; 
            
            /* 💡 防止圖片因為太小而像磁磚一樣在手機裡重複拼貼 */
            background-repeat: no-repeat; 
            
            background-position: center; /* 讓橫式圖片在直式手機裡上下置中 */

            transition: opacity 0.3s ease, transform 0.3s ease;

        // 核心 1：基礎手機面板解鎖與相簿切換邏輯（維持您原本完美的設定）
        // ============================================================
        const unlockBtn = document.getElementById('unlockBtn');
        const lockScreen = document.getElementById('lockScreen');
        const widgetTopRight = document.getElementById('widgetTopRight');
        const widgetBottomLeft = document.getElementById('widgetBottomLeft');
        const galleryScreen = document.getElementById('galleryScreen');
        const galleryBackBtn = document.getElementById('galleryBackBtn');
        const widgetCalendar = document.getElementById('widgetCalendar');
        const calendarScreen = document.getElementById('calendarScreen');
        const calendarBackBtn = document.getElementById('calendarBackBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const bottomToast = document.getElementById('bottom-toast');
        let toastTimeout; // 維持你原本的 timeout 變數命名格式


        unlockBtn.addEventListener('click', function() {
            lockScreen.classList.add('unlocked');
            
            /* 🚫 新增防線：解鎖成功進入主畫面時，用 JS 強行將相機按鈕與提示氣泡徹底變不見 */
            if (bottomToast) bottomToast.style.display = 'none';
            if (cameraBtn) cameraBtn.style.display = 'none';
        });


        widgetTopRight.addEventListener('click', function() {
            galleryScreen.style.backgroundImage = "url('gallery1.png')";
            galleryScreen.classList.add('show');
        });

        widgetBottomLeft.addEventListener('click', function() {
            galleryScreen.style.backgroundImage = "url('gallery2.png')";
            galleryScreen.classList.add('show');
        });

        galleryBackBtn.addEventListener('click', function() {
            galleryScreen.classList.remove('show');
        });

        widgetCalendar.addEventListener('click', function() {
            calendarScreen.style.backgroundImage = "url('calendar_large.png')";
            calendarScreen.classList.add('show');
        });

        calendarBackBtn.addEventListener('click', function() {
            calendarScreen.classList.remove('show');
        });

        // 蘋果循環通知
        const appleRedBtn = document.getElementById('appleRedBtn');
        const appleGreenBtn = document.getElementById('appleGreenBtn');
        const phoneNotification = document.getElementById('phoneNotification');
        const notiText = phoneNotification.querySelector('.noti-text'); 
        let notiTimeout;

        const redMessages = ['夏以晝是我的！', '不要偷看我哥哥！', '😠'];
        let redIndex = 0;
        const greenMessages = ['嗯？你找她？', '好奇心太重，可不是什麼好事。', '她不喜歡別人亂看她東西。'];
        let greenIndex = 0;

        function triggerNotification(text) {
            clearTimeout(notiTimeout);
            notiText.textContent = text;
            phoneNotification.classList.add('show');
            notiTimeout = setTimeout(function() {
                phoneNotification.classList.remove('show');
            }, 3000);
        }

        appleRedBtn.addEventListener('click', function() {
            triggerNotification(redMessages[redIndex]);
            redIndex = (redIndex + 1) % redMessages.length;
        });

        appleGreenBtn.addEventListener('click', function() {
            triggerNotification(greenMessages[greenIndex]);
            greenIndex = (greenIndex + 1) % greenMessages.length;
        });

        // 相機底部彈出通知（維持你原本 triggerNotification 的清除計時與 show 類別格式）
        cameraBtn.addEventListener('click', function() {
            clearTimeout(toastTimeout);
            
            // 先移除 show 確保連續點擊時動畫能重新觸發
            bottomToast.classList.remove('show');
            
            // 延遲讓瀏覽器重繪，隨後加入 show 讓通知滑上來
            setTimeout(function() {
                bottomToast.classList.add('show');
                
                // 維持你原本設定的 3000 毫秒（3秒）後自動移除並滑回去
                toastTimeout = setTimeout(function() {
                    bottomToast.classList.remove('show');
                }, 3000);
            }, 10);
        });



        // ============================================================
        // 核心 2：🔊 獨立運作的音樂與跑馬燈控制區（整個大框框皆可點擊）
        // ============================================================

        bgMusic.volume = 0.3; 
        
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const marqueeText = document.querySelector('.marquee-text');
        const musicControlBox = document.querySelector('.music-control-box'); 

        // 💡 點擊「整個音樂控制盒（跑馬燈+喇叭）」➔ 切換 播放/靜音 狀態
        musicControlBox.addEventListener('click', function(e) {
            e.stopPropagation(); // 防止點擊事件干擾到網頁其他元件
            console.log("整個音樂盒被點擊了！目前播放狀態為:", bgMusic.paused);
            
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    musicToggleBtn.textContent = '🔊';
                    marqueeText.style.animationPlayState = 'running'; // 跑馬燈繼續滾動
                }).catch(err => {
                    console.log("播放失敗，可能需要先點擊網頁任意地方:", err);
                });
            } else {
                bgMusic.pause();
                musicToggleBtn.textContent = '🔇'; // 切換為靜音符號
                marqueeText.style.animationPlayState = 'paused'; // 點擊靜音時字會停下
            }
        });


        // ============================================================
        // 核心 3：🔒 全網頁手機密碼防護牆（雙重防線：完美破解自動播放攔截）
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            const correctPassword = "0503"; 
            let enterPassword = prompt("【芝麻開門】\n請輸入通關密語以查看手機");
            
            while (enterPassword !== correctPassword) {
                if (enterPassword === null) {
                    document.body.innerHTML = `
                        <div style="background-color:#121212; color:#ef4444; text-align:center; padding-top:30vh; width:100vw; height:100vh; font-family:sans-serif; position:fixed; top:0; left:0; z-index:99999;">
                            <h1 style="font-size:32px; margin-bottom:10px;">🔒 訪問已被拒絕</h1>
                            <p style="color:#888; font-size:18px; margin-top:20px;">您必須輸入正確的通關密語才能查看手機。</p>
                        </div>
                    `;
                    return; 
                }
                enterPassword = prompt("❌ 密碼錯誤！提示：夏以晝最喜歡的人的生日 (四碼)");
            }
            
            // 🔓 密碼輸入正確後
            console.log("🔓 歡迎進入深空！");
            
            // 【第一防線】嘗試在按下密碼確定的瞬間直接播放音樂
            bgMusic.play().then(() => {
                musicToggleBtn.textContent = '🔊';
                marqueeText.style.animationPlayState = 'running';
                console.log("🔊 成功！瀏覽器允許直接播放音樂。");
            }).catch(function(error) {
                console.log("⚠️ 第一防線遭攔截！改為啟動【第二防線】：等待使用者觸碰網頁螢幕...");
                
                // 【第二防線】完美隱形捕捉：只要使用者在網頁上隨便點任何地方，就立刻喚醒音樂！
                // { once: true } 確保這個補償機制觸發一次後就自動功成身退，不會影響後續點擊。
                document.body.addEventListener('click', function() {
                    if (bgMusic.paused) {
                        bgMusic.play().then(() => {
                            musicToggleBtn.textContent = '🔊';
                            marqueeText.style.animationPlayState = 'running';
                            console.log("🔊 成功！透過使用者觸碰網頁畫面，強制喚醒背景音樂。");
                        }).catch(e => console.log("喚醒失敗:", e));
                    }
                }, { once: true });
            });
        });

        // ============================================================
        // 3. JavaScript 邏輯：雙層巢狀便利貼與大圖切換核心邏輯            
        // ============================================================
        
        // 📂 【設定資料庫】直接在裡面幫每一張加上專屬的 footer！
        const stickyData = {
            orange: {
                title: "Happy Graduation 🎓",
                notes: [
                    { text: "文武雙全、才貌兼備的經理在這裡留下了訊息...🎉", image: "orange_bg.png", footer: "Amber💖" } // 👈 橘色專屬
                ]
            },
            red: {
                title: "Best Wish ❤️",
                notes: [
                    { text: "開銀行的里長伯在這裡留下了足跡...🥰", image: "red_pic1.png", footer: "Lily✨" },      // 👈 第一張自訂
                    { text: "系醬&可頌的媽咪在這裡撒了閃亮亮金粉...✨", image: "red_pic2.png", footer: "可可💞" },     // 👈 第二張自訂
                    { text: "茶寶大廚、三貓家長在這裡煮了一道菜...🍳", image: "red_pic3.png", footer: "小暴😎" },    // 👈 第三張自訂
                    { text: "行動點歌機在這裡唱了一首歌...🎵", image: "red_pic4.png", footer: "惠茹🌼" }       // 👈 第四張自訂
                ]
            },
            green: {
                title: "From TP Members 👥",
                notes: [
                    { text: "手搖飲好夥伴在這裡放了杯奶茶...🥤", image: "green_pic1.png", footer: "Yuri🍥" },
                    { text: "門市綠手指在此種了一棵植物...🌱", image: "green_pic2.png", footer: "思秀🍀" },
                    { text: "秦徹的小狸花在這裡借放了一下梅菲斯特...🐦‍⬛", image: "green_pic3.png", footer: "Lucy🐱" },
                    { text: "會計專家在這裡留下了薪資條...💵", image: "green_pic4.png", footer: "咨昱🌞" }
                ]
            }
        };


        // 綁定網頁上的 HTML 標籤元件
        const stickyWallOverlay = document.getElementById('stickyWallOverlay');
        const stickyWallTitle = document.getElementById('stickyWallTitle');
        const stickyNotesGrid = document.getElementById('stickyNotesGrid');
        const stickyGalleryScreen = document.getElementById('stickyGalleryScreen');

        // 打開【第一層】：鋪設並開啟便利貼牆面（個別自訂右下角版）
        function openStickyWall(type) {
            const data = stickyData[type];
            if (!data) return;

            stickyWallTitle.textContent = data.title;
            stickyNotesGrid.innerHTML = ""; // 清空上一次的舊紙條

            if (data.notes.length === 1) {
                stickyNotesGrid.classList.add('single-note');
            } else {
                stickyNotesGrid.classList.remove('single-note');
            }

            data.notes.forEach((note, index) => {
                const noteCard = document.createElement('div');
                noteCard.className = 'sticky-note-card';
                
                // 🔒 點擊功能完全保留！點了依然能完美開啟大圖，絕不受影響
                noteCard.onclick = function() {
                    openStickyGallery(note.image); 
                };

                // 🌸 核心修正：將原本死板的 #\${index + 1} 📌，改為自動讀取你自訂的 note.footer！
                // 如果你忘記在資料庫寫 footer，它會貼心地幫你自動用原本的數字和圖釘當備份，防呆不破圖！
                const displayFooter = note.footer ? note.footer : `#${index + 1} 📌`;

                noteCard.innerHTML = `
                    <div class="sticky-note-text">${note.text}</div>
                    <div class="sticky-note-footer">${displayFooter}</div>
                `;
                stickyNotesGrid.appendChild(noteCard);
            });

            stickyWallOverlay.classList.add('show');
        }


        // 🔴 關閉【第一層】：點擊大 (×) 鈕，徹底退出牆面回到手機桌面
        function closeStickyWall() {
            stickyWallOverlay.classList.remove('show');
        }

        // 🖼️ 打開【第二層】：進入滿版大圖展示
        function openStickyGallery(imagePath) {
            stickyGalleryScreen.style.backgroundImage = `url('${imagePath}')`; // 更換背景圖檔名
            stickyGalleryScreen.classList.add('show');                        // 照片从小放大滑入
        }

        // 🔙 關閉【第二層】：在大圖時點擊返回鍵 ➔ 只關閉大圖，安全回到【第一層便利貼牆】
        function closeStickyGallery() {
            stickyGalleryScreen.classList.remove('show');
        }

        // ============================================================
        // 3. JavaScript 邏輯：手機內建本地實體影片播放系統           
        // ============================================================
        
        // 💡 1. 在這裡設定您準備好的影片檔案名稱（建議格式為 mp4）
        const localVideoName = "my_video.mp4"; 

        const ytVideoBtn = document.getElementById('ytVideoBtn');
        const ytPlayerOverlay = document.getElementById('ytPlayerOverlay');
        const ytPlayerIframePlace = document.getElementById('ytPlayerIframePlace');

        // 🎬 🟢 打開手機內建影片播放器
        ytVideoBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // 防止點擊干擾到網頁其他元件
            
            // 💡 核心改動：改為動態生成網頁原生 <video> 標籤，並開啟 controls (進度條播放鍵) 方便操作
            ytPlayerIframePlace.innerHTML = `
                <video id="phoneInnerVideo" src="${localVideoName}" controls autoplay></video>
            `;
            
            // 💡 打開影片時，自動暫停背景音樂 (bgm.mp3)，避免聲音打架
            if (!bgMusic.paused) {
                bgMusic.pause();
                musicToggleBtn.textContent = '🔇';
                marqueeText.style.animationPlayState = 'paused';
            }

            // 顯示影片播放器遮罩層
            ytPlayerOverlay.classList.add('show');
        });

        // ❌ 🔴 關閉手機內建影片播放器
        function closeYtPlayer() {
            // 抓取剛才生成的影片元件並將它暫停
            const currentVideo = document.getElementById('phoneInnerVideo');
            if (currentVideo) {
                currentVideo.pause();
            }
            
            // 💡 徹底將影片結構從網頁中拔除，確保背景完全安靜不偷放聲音
            ytPlayerIframePlace.innerHTML = "";
            
            // 隱藏影片播放器遮罩層
            ytPlayerOverlay.classList.remove('show');
            
            // 💡 貼心優化：影片關閉後，自動將原本的網頁背景音樂恢復播放！
            bgMusic.play().then(() => {
                musicToggleBtn.textContent = '🔊';
                marqueeText.style.animationPlayState = 'running';
            }).catch(e => console.log("重啟背景音樂遭攔截:", e));
        }

        // ============================================================
        // 📦 核心 4：3D 娃娃【時序控制完全體：先解碼再載入 + 三大互動】邏輯
        // ============================================================
        const avatar3D = document.getElementById('avatar3D');

        if (avatar3D) {
            function init3DModel() {
                try {
                    // 1. 強迫第一步：在網頁載入檔案前，必須先完成解碼鑰匙的註冊
                    if (window.MeshoptDecoder) {
                        avatar3D.registerExternalExtension('EXT_meshopt_compression', window.MeshoptDecoder);
                        console.log("⚡ [3D 時序控制] Meshopt 解碼鑰匙優先註冊成功！");
                    }
                } catch (e) {
                    console.log("⚠️ 解碼器註冊時發生異常:", e);
                }

                // 2. 強迫第二步：解碼鑰匙註冊完畢後，才正式把 3D 娃娃的版本號網址灌進去載入
                const realSrc = avatar3D.getAttribute('data-src');
                if (realSrc) {
                    avatar3D.src = realSrc;
                }

                let startTime = Date.now();
                let isSpinning = false;

                // 💡 互動一：上下漂浮動畫
                function floatAnimation() {
                    const elapsedTime = (Date.now() - startTime) / 1000;
                    const floatY = Math.sin(elapsedTime * 2.5) * 0.12; 
                    avatar3D.cameraTarget = `0m ${0.5 + floatY}m 0m`;
                    requestAnimationFrame(floatAnimation);
                }
                
                // 娃娃完全載入成功後才開啟漂浮
                avatar3D.addEventListener('load', () => {
                    console.log("🌸 [3D 成功通知] 夏以晝娃娃已排除時序衝突，成功在網頁現形！");
                    floatAnimation();
                });

                // 💡 互動二：滑鼠點擊驚喜回饋（點一下娃娃，它會快速自轉一圈）
                avatar3D.addEventListener('click', () => {
                    if (isSpinning) return;
                    isSpinning = true;
                    
                    avatar3D.style.transition = "transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)";
                    avatar3D.style.transform = "rotateY(360deg)";
                    
                    setTimeout(() => {
                        avatar3D.style.transition = "none";
                        avatar3D.style.transform = "rotateY(0deg)";
                        isSpinning = false;
                    }, 600);
                });

                // 💡 互動三：眼神跟隨滑鼠
                window.addEventListener('mousemove', (event) => {
                    if (isSpinning) return;

                    const rect = avatar3D.getBoundingClientRect();
                    const dollCenterX = rect.left + rect.width / 2;
                    const dollCenterY = rect.top + rect.height / 2;

                    const deltaX = event.clientX - dollCenterX;
                    const deltaY = event.clientY - dollCenterY;

                    const maxTurnAngle = 25; 
                    const targetYaw = Math.max(-maxTurnAngle, Math.min(maxTurnAngle, (deltaX / window.innerWidth) * 90));
                    const targetPitch = 75 + Math.max(-8, Math.min(8, (deltaY / window.innerHeight) * 30));

                    avatar3D.cameraOrbit = `${targetYaw}deg ${targetPitch}deg 105%`;
                });
            }

            // ⚡ 確保整張網頁所有元件、圖片（包含解碼器 JS 檔）都完全下載完了，才執行 init3DModel
            if (document.readyState === 'complete') {
                init3DModel();
            } else {
                window.addEventListener('load', init3DModel);
            }
        }



    </script>


</body>
</html>

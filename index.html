<<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <!-- 💡 圖片預載魔法：一進網頁就在背景偷跑下載，點擊時就能秒開！ -->
    <link rel="preload" href="homescreen.png" as="image">
    <link rel="preload" href="lockscreen.png" as="image">
    <link rel="preload" href="gallery1.png" as="image">
    <link rel="preload" href="gallery2.png" as="image">
    <link rel="preload" href="calendar_large.png" as="image">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Caleb's Lover </title>
    <style>
        /* 基礎頁面樣式，讓手機框置中 */
         body {
            margin: 0;
            padding: 0;
    
        /* 1. 關鍵組合：底色（白色）+ 你的背景圖片 */
            background-image: 
            linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), /* 👈 第一層：半透明白色濾鏡（0.5代表50%變淡，數字越大背景越白越淡） */
            url('website-bg.png'); /* 👈 第二層：你的橫幅背景圖片檔名 */
        
            background-size: cover;                 /* 自動鋪滿全螢幕 */
    
        /* 2. 關鍵修改：將置中(center)改成靠右(right)，把被擋住的人臉往右邊推 */
            background-position: right center;      
    
            background-repeat: no-repeat;            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 模擬手機外框 */
        .phone-container {
            position: relative;
            width: 390px; 
            height: 844px; 
            border: 13px solid #333; /* 💡 可以在這裡修改手機外框顏色 */
            border-radius: 40px;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 💡 終極完美版：空心平移技術，百分之百精準壓在 13px 手機框上 */
        .phone-container::after {
            content: "";
            position: absolute;
            
            /* 1. 💡 關鍵平移：因為你手機框是 13px，我們將反光膜往外推 13px，精準對齊邊框外緣 */
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            
            /* 2. 完美的圓角貼合 */
            border-radius: 40px; 
            
            /* 3. 💡 設定成跟你手機框完全一樣的 13px 粗細 */
            border: 13px solid transparent; 
            
            /* 4. 💡 核心魔法：利用向內刷的內陰影（inset），它會百分之百強行刷在這層空心膜上，完美覆蓋你的手機殼！ */
            box-shadow: 
                inset 5px 5px 10px rgba(255, 255, 255, 0.5),   /* 左上角：強烈金屬高光（白光） */
                inset -5px -5px 10px rgba(0, 0, 0, 0.5),       /* 右下角：金屬深色陰影（黑影） */
                inset -2px -2px 4px rgba(255, 255, 255, 0.3),  /* 輔助右下亮邊 */
                inset 2px 2px 4px rgba(0, 0, 0, 0.4);          /* 輔助左上暗邊 */
                
            /* 5. 確保層級絕對在最上層（高於手機底色和內部圖片） */
            z-index: 25; 
            
            /* 6. 保持滑鼠點擊穿透，完全不影響你之前對準好的任何按鈕 */
            pointer-events: none; 
        }

        /* 瀏海 / 動態島效果 */
        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: black;
            border-radius: 15px;
            z-index: 20;
        }

        /* ----------------------------------
           1. 鎖定畫面 (Lock Screen)
        ------------------------------------- */
        .lock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('lockscreen.png'); /* 💡 鎖定畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 15;
            transition: opacity 0.5s ease, transform 0.5s ease; /* 解鎖時的淡出動畫 */
        }

        /* 當解鎖時，鎖定畫面會變透明並往上滑開 */
        .lock-screen.unlocked {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none; /* 讓它失去點擊功能，才點得到底下的主畫面 */
        }

        /* 鎖定畫面左下角的蘋果點擊熱區 */
        .apple-unlock-btn {
            position: absolute;
            bottom: 5.5%;
            left: 11.4%;
            width: 13%;
            height: 6%;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 50%;
            cursor: pointer;
            z-index: 16;
        }

        /* ----------------------------------
           2. 主畫面 (Home Screen)
        ------------------------------------- */
        .home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('homescreen.png'); /* 💡 主畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 5;
        }

        /* 主畫面點擊熱區的通用樣式 */
        .clickable-icon {
            position: absolute;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .clickable-icon:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 主畫面的 Icon 定位 (保持原本的設定) */
        .icon-star { top: 7.7%; left: 8.5%; width: 15%; height: 7.2%; }
        .icon-caleb { top: 7.7%; left: 31.5%; width: 15%; height: 7.2%; }
        .icon-calendar { top: 18.8%; left: 8.5%; width: 15%; height: 7.3%; }
        .icon-apple-red { top: 18.8%; left: 31.5%; width: 15%; height: 7.3%; }
        .icon-apple-green { top: 30.5%; left: 31.5%; width: 15%; height: 7.3%; }
        .widget-top-right { top: 7.7%; left: 54%; width: 38%; height: 18.5%; border-radius: 20px; }
        .widget-bottom-left { top: 55.7%; left: 8.5%; width: 38%; height: 18.7%; border-radius: 20px; }
        .dock-orange { bottom: 3.8%; left: 19.7%; width: 15.1%; height: 7%; }
        .dock-red { bottom: 3.8%; left: 42.5%; width: 15.1%; height: 7%; }
        .dock-green { bottom: 3.8%; left: 65.5%; width: 15.1%; height: 7%; }

        /* ----------------------------------
           3. 💡 新增：獨立的大圖畫面層 (Gallery Screen)
        ------------------------------------- */
        .gallery-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 高於主畫面桌面，低於動態島和金屬外殼 */
            opacity: 0;
            transform: translateY(100%); /* 預設在手機下方，準備往上滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        /* 當大圖畫面被打開時（模仿解鎖切換感） */
        .gallery-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 大圖畫面的圓形返回鍵 (✕) */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            width: 38px;
            height: 38px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        /* 大圖畫面的圓形返回鍵 (✕) - 💡 調整為更小、更淡 */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            
            /* 📐 1. 調整大小：原本 38px，縮小為 28px */
            width: 28px;
            height: 28px;
            
            /* 🎨 2. 調整顏色與淡度：原本 0.6，調淡為 0.35 的極輕透半透明黑 */
            background-color: rgba(0, 0, 0, 0.35);
            
            color: rgba(255, 255, 255, 0.8); /* 讓叉叉文字也帶有一點透明度 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            
            /* 📐 3. 調整字型大小：配合按鈕縮小，文字從 18px 縮小為 14px */
            font-size: 14px;
            
            font-weight: bold;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.2); /* 讓陰影也隨之變淡 */
            transition: background 0.2s, opacity 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        
        /* 滑鼠移上去時稍微變明顯（增強互動感） */
        .gallery-back-btn:hover {
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .gallery-back-btn:active {
            transform: scale(0.9);
        }

        /* 💡 新增：日曆專屬的大圖畫面層 */
        .calendar-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 跟原本相簿大圖同層 */
            opacity: 0;
            transform: translateY(100%); /* 預設在下方準備滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        /* 當日曆大圖被打開時 */
        .calendar-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 💡 新增：手機模擬通知訊息框 */
        .phone-notification {
            position: absolute;
            top: -100px; /* 預設藏在手機螢幕的最上方外側 */
            left: 5%;
            width: 90%;
            background-color: rgba(255, 255, 255, 0.9); /* 半透明白色，像系統通知 */
            backdrop-filter: blur(10px); /* 蘋果系統的毛玻璃毛邊效果 */
            color: #333333;
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 18px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            z-index: 30; /* 層級非常高，必須蓋在所有畫面之上，甚至蓋在動態島附近 */
            display: flex;
            align-items: center;
            font-size: 14px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-weight: bold;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 帶有一點彈性的滑入動畫 */
        }
        
        /* 當通知被激活動態滑下來時 */
        .phone-notification.show {
            top: 60px; /* 滑動到動態島下方的位置 */
        }

        /* 通知內的小系統圖示 */
        .noti-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        /* ================= 💡 新增：音樂控制區與跑馬燈樣式 ================= */
        .music-control-box {
            position: fixed; 
            top: 25px;       
            right: 25px;     
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;    
            background-color: rgba(0, 0, 0, 0.45); 
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px); 
            width: 200px; 
            overflow: hidden;
            opacity: 0.65;   
            transition: opacity 0.3s ease, transform 0.3s ease;
            
            /* 💡 新增這行：讓滑鼠移到整個跑馬燈區塊時，都會變成可以點擊的小手 */
            cursor: pointer; 
        }
        .music-control-box:hover {
            opacity: 1; /* 滑鼠移上去時變清晰 */
        }

        /* 跑馬燈可視外框 */
        .marquee-wrapper {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            width: 100px; /* 固定跑馬燈寬度 */
        }

        /* 跑馬燈文字本體與無限滾動動畫 */
        .marquee-text {
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            font-weight: bold;
            padding-left: 100%; /* 從最右側外面開始滑入 */
            animation: marqueeEffect 10s linear infinite;
        }

        /* 跑馬燈動畫軌跡：從右到左無限循環 */
        @keyframes marqueeEffect {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* 喇叭按鈕樣式 */
        .music-icon-btn {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
            color: #ffffff;
        }
        .music-icon-btn:active {
            transform: scale(0.85); /* 點擊時縮放回饋 */
        }

        /* ============================================================ */
        /* 1. CSS 樣式：雙層巢狀便利貼系統                               */
        /* ============================================================ */
        
        /* 【全螢幕黑色半透明遮罩】用來把底下的手機主畫面變暗與模糊 */
        .sticky-wall-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65); /* 65%透明度的黑底 */
            backdrop-filter: blur(8px);           /* 蘋果毛玻璃模糊特效 */
            z-index: 40;                          /* 確保蓋在桌面圖示上 */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;                           /* 預設隱形 */
            pointer-events: none;                 /* 預設不可點擊，防止擋到桌面 */
            transition: opacity 0.4s ease;        /* 0.4秒平滑淡入動畫 */
        }
        
        /* 當 JavaScript 幫忙加上 .show 類別時就會顯示出來 */
        .sticky-wall-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 【白色透明色塊容器】放置便利貼的半透明白色大框框 */
        .sticky-wall-container {
            width: 88%;
            max-height: 75%;
            background-color: rgba(255, 255, 255, 0.2); /* 20%半透明白底（你要求的透明色塊） */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 20px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* 標題與右上角 (×) 關閉按鈕的排版 */
        .sticky-wall-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }
        .sticky-close-btn {
            width: 28px;
            height: 28px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 便利貼網格佈局：一列自動排兩張 */
        .sticky-notes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            overflow-y: auto;                     /* 💡 超過4張時，此區域會自動出現滾動條 */
            padding: 5px;
        }
        
        /* 💡 針對只有1張便利貼（橘色按鈕）時的特殊置中加大樣式 */
        .sticky-notes-grid.single-note {
            grid-template-columns: 1fr;
            justify-items: center;
        }

        /* 【便利貼小紙條本體】手寫便籤感樣式 */
        .sticky-note-card {
            width: 100%;
            aspect-ratio: 1 / 1;                  /* 完美正方形 */
            max-width: 130px;
            padding: 12px;
            box-sizing: border-box;
            background-color: #fef08a;             /* 經典便利貼粉黃色 */
            color: #334155;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
            transform: rotate(-1.5deg);           /* 微微向左傾斜，營造真實黏貼感 */
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-bottom-right-radius: 15px 3px; /* 💡 魔法細節：讓便籤右下角看起來微翹 */
        }
        
        /* 💡 新增：四張便利貼時，各自獨立指派【黃、橘、粉、紫】四色與傾斜角度 */
        
        /* 🟡 第 1 張便利貼：原本的粉黃色（往左微傾斜） */
        .sticky-note-card:nth-child(4n+1) {
            background-color: #fff6c0; 
            transform: rotate(-1.5deg);
        }
        
        /* 🟠 第 2 張便利貼：原本的粉橘色（往右微傾斜） */
        .sticky-note-card:nth-child(4n+2) {
            background-color: #ffe9d4; 
            transform: rotate(2deg);
        }
        
        /* 🌸 第 3 張便利貼：新增的浪漫粉紅色（往左微傾斜） */
        .sticky-note-card:nth-child(4n+3) {
            background-color: #ffe9e9; /* 柔和粉紅色 */
            transform: rotate(-2.5deg); /* 微調傾斜度，看起來更自然不呆板 */
        }
        
        /* 🍇 第 4 張便利貼：新增的夢幻藍（往右微傾斜） */
        .sticky-note-card:nth-child(4n+4) {
            background-color: #e1f1ff; /* 柔和藍色 */
            transform: rotate(1.5deg);
        }

        
        /* 滑鼠懸停時微放大、立正，並加深陰影 */
        .sticky-note-card:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.25);
            z-index: 2;
        }
        
        .sticky-note-text {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            word-break: break-all;
        }
        
        .sticky-note-footer {
            font-size: 10px;
            text-align: right;
            color: #64748b;
        }

          /* 【第二層】滿版展示大圖畫面層（💡 適應型：自動縮放不切圖） */
        .sticky-gallery-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* 📐 核心魔法：從 cover 改成 contain，照片會自動縮小到「完全看得見整張圖」為止 */
            background-size: contain; 
            
            /* 💡 防止圖片因為太小而像磁磚一樣在手機裡重複拼貼 */
            background-repeat: no-repeat; 
            
            background-position: center; /* 讓橫式圖片在直式手機裡上下置中 */
            
            /* 🎨 新增底色：橫式圖點開後，上下露出的空隙會自動補上質感黑底（也可以改成 #ffffff 白色） */
            background-color: rgba(0, 0, 0, 0.7); 
            
            z-index: 45; 
            opacity: 0;
            transform: scale(0.9); 
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        
        /* 當打開大圖時 */
        .sticky-gallery-screen.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* ============================================================ */
        /* 1. CSS 樣式：手機內建 YouTube 播放器系統                     */
        /* ============================================================ */
        
        /* YouTube 播放器的全螢幕黑色半透明遮罩 */
        .yt-player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* 較深的黑底，讓看影片更沉浸 */
            backdrop-filter: blur(5px);
            z-index: 50;                          /* 層級高於便利貼牆(40)與大圖層(45) */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;                           /* 預設隱形 */
            pointer-events: none;                 /* 預設不可點擊 */
            transition: opacity 0.4s ease;
        }
        
        /* 當被 JavaScript 激活打開時 */
        .yt-player-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 影片播放盒容器（限制在直式手機寬度內，保持 16:9 比例） */
        .yt-video-container {
            width: 95%;
            aspect-ratio: 16 / 9;                 /* 完美的 YouTube 影片標準比例 */
            background-color: #000000;

            clearTimeout(notiTimeout);

            phoneNotification.classList.add('show');
            notiTimeout = setTimeout(function() {
                phoneNotification.classList.remove('show');
            }, 3000);
        }

        appleRedBtn.addEventListener('click', function() {

        // ============================================================
        // 核心 2：🔊 獨立運作的音樂與跑馬燈控制區（整個大框框皆可點擊）

            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    musicToggleBtn.textContent = '🔊';
                    marqueeText.style.animationPlayState = 'running'; // 跑馬燈繼續滾動
                }).catch(err => {
                    console.log("播放失敗，可能需要先點擊網頁任意地方:", err);

                musicToggleBtn.textContent = '🔇'; // 切換為靜音符號

            bgMusic.play().then(() => {
                musicToggleBtn.textContent = '🔊';
                marqueeText.style.animationPlayState = 'running';
                console.log("🔊 成功！瀏覽器允許直接播放音樂。");
            }).catch(function(error) {
                console.log("⚠️ 第一防線遭攔截！改為啟動【第二防線】：等待使用者觸碰網頁螢幕...");
                
                // 【第二防線】完美隱形捕捉：只要使用者在網頁上隨便點任何地方，就立刻喚醒音樂！
                // { once: true } 確保這個補償機制觸發一次後就自動功成身退，不會影響後續點擊。
                document.body.addEventListener('click', function() {
                    if (bgMusic.paused) {
                        bgMusic.play().then(() => {
                            musicToggleBtn.textContent = '🔊';

                            console.log("🔊 成功！透過使用者觸碰網頁畫面，強制喚醒背景音樂。");

                }, { once: true });

        // ============================================================
        // 3. JavaScript 邏輯：雙層巢狀便利貼與大圖切換核心邏輯

        // 📂 【設定資料庫】未來要修改便籤文字、或換照片，直接改這區最快！
        const stickyData = {
            orange: {

                    { text: "畢業快樂！未來也要一起走下去呀✨", image: "orange_bg.png" } // 👈 1張便利貼

        const stickyWallOverlay = document.getElementById('stickyWallOverlay');

        const stickyGalleryScreen = document.getElementById('stickyGalleryScreen');

        // 🟢 打開【第一層】：自動鋪設並開啟便利貼牆面
        function openStickyWall(type) {
            const data = stickyData[type]; // 抓出對應顏色的資料包
            if (!data) return;

            stickyWallTitle.textContent = data.title; // 換上標題文字
            stickyNotesGrid.innerHTML = "";           // 💡 清空上一次殘留的舊紙條

            // 如果只有1張便利貼（橘色），套用單張置中的 CSS 排版
            if (data.notes.length === 1) {
                stickyNotesGrid.classList.add('single-note');
            } else {
                stickyNotesGrid.classList.remove('single-note');
            }

            // 用迴圈把資料庫裡的每條文字，做成實體小黃紙條丟進網頁
            data.notes.forEach((note, index) => {

                // 設定點擊紙條動作：傳入綁定的照片檔名，開啟【第二層大圖】

                    openStickyGallery(note.image);

        const ytVideoBtn = document.getElementById('ytVideoBtn');

            ytPlayerIframePlace.innerHTML = `

            `;
            
            // 💡 打開影片時，自動暫停背景音樂 (bgm.mp3)，避免聲音打架
            if (!bgMusic.paused) {
                bgMusic.pause();
                musicToggleBtn.textContent = '🔇';

        function closeYtPlayer() {

            if (currentVideo) {
                currentVideo.pause();
            }
            
            // 💡 徹底將影片結構從網頁中拔除，確保背景完全安靜不偷放聲音

            // 💡 貼心優化：影片關閉後，自動將原本的網頁背景音樂恢復播放！
            bgMusic.play().then(() => {
                musicToggleBtn.textContent = '🔊';
                marqueeText.style.animationPlayState = 'running';
            }).catch(e => console.log("重啟背景音樂遭攔截:", e));
        }


    </script>


</body>
</html>

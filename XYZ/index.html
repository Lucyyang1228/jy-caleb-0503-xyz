<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戀與深空 - 手機模擬器</title>
    <style>
        /* 基礎頁面樣式，讓手機框置中 */
         body {
            margin: 0;
            padding: 0;
    
        /* 1. 關鍵組合：底色（白色）+ 你的背景圖片 */
            background-image: 
            linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), /* 👈 第一層：半透明白色濾鏡（0.5代表50%變淡，數字越大背景越白越淡） */
            url('website-bg.png'); /* 👈 第二層：你的橫幅背景圖片檔名 */
        
            background-size: cover;                 /* 自動鋪滿全螢幕 */
    
        /* 2. 關鍵修改：將置中(center)改成靠右(right)，把被擋住的人臉往右邊推 */
            background-position: right center;      
    
            background-repeat: no-repeat;            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 模擬手機外框 */
        .phone-container {
            position: relative;
            width: 390px; 
            height: 844px; 
            border: 13px solid #333; /* 💡 可以在這裡修改手機外框顏色 */
            border-radius: 40px;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 💡 終極完美版：空心平移技術，百分之百精準壓在 13px 手機框上 */
        .phone-container::after {
            content: "";
            position: absolute;
            
            /* 1. 💡 關鍵平移：因為你手機框是 13px，我們將反光膜往外推 13px，精準對齊邊框外緣 */
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            
            /* 2. 完美的圓角貼合 */
            border-radius: 40px; 
            
            /* 3. 💡 設定成跟你手機框完全一樣的 13px 粗細 */
            border: 13px solid transparent; 
            
            /* 4. 💡 核心魔法：利用向內刷的內陰影（inset），它會百分之百強行刷在這層空心膜上，完美覆蓋你的手機殼！ */
            box-shadow: 
                inset 5px 5px 10px rgba(255, 255, 255, 0.5),   /* 左上角：強烈金屬高光（白光） */
                inset -5px -5px 10px rgba(0, 0, 0, 0.5),       /* 右下角：金屬深色陰影（黑影） */
                inset -2px -2px 4px rgba(255, 255, 255, 0.3),  /* 輔助右下亮邊 */
                inset 2px 2px 4px rgba(0, 0, 0, 0.4);          /* 輔助左上暗邊 */
                
            /* 5. 確保層級絕對在最上層（高於手機底色和內部圖片） */
            z-index: 25; 
            
            /* 6. 保持滑鼠點擊穿透，完全不影響你之前對準好的任何按鈕 */
            pointer-events: none; 
        }

        /* 瀏海 / 動態島效果 */
        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: black;
            border-radius: 15px;
            z-index: 20;
        }

        /* ----------------------------------
           1. 鎖定畫面 (Lock Screen)
        ------------------------------------- */
        .lock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('lockscreen.png'); /* 💡 鎖定畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 15;
            transition: opacity 0.5s ease, transform 0.5s ease; /* 解鎖時的淡出動畫 */
        }

        /* 當解鎖時，鎖定畫面會變透明並往上滑開 */
        .lock-screen.unlocked {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none; /* 讓它失去點擊功能，才點得到底下的主畫面 */
        }

        /* 鎖定畫面左下角的蘋果點擊熱區 */
        .apple-unlock-btn {
            position: absolute;
            bottom: 5.5%;
            left: 11.4%;
            width: 13%;
            height: 6%;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 50%;
            cursor: pointer;
            z-index: 16;
        }

        /* ----------------------------------
           2. 主畫面 (Home Screen)
        ------------------------------------- */
        .home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('homescreen.png'); /* 💡 主畫面圖片名稱 */
            background-size: cover;
            background-position: center;
            z-index: 5;
        }

        /* 主畫面點擊熱區的通用樣式 */
        .clickable-icon {
            position: absolute;
            background: rgba(255, 0, 0, 0); /* 💡 測試時可以把最後的 0 改成 0.5 看位置 */
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .clickable-icon:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 主畫面的 Icon 定位 (保持原本的設定) */
        .icon-star { top: 7.7%; left: 8.5%; width: 15%; height: 7.2%; }
        .icon-caleb { top: 7.7%; left: 31.5%; width: 15%; height: 7.2%; }
        .icon-calendar { top: 18.8%; left: 8.5%; width: 15%; height: 7.3%; }
        .icon-apple-red { top: 18.8%; left: 31.5%; width: 15%; height: 7.3%; }
        .icon-apple-green { top: 30.5%; left: 31.5%; width: 15%; height: 7.3%; }
        .widget-top-right { top: 7.7%; left: 54%; width: 38%; height: 18.5%; border-radius: 20px; }
        .widget-bottom-left { top: 55.7%; left: 8.5%; width: 38%; height: 18.7%; border-radius: 20px; }
        .dock-orange { bottom: 3.8%; left: 19.7%; width: 15.1%; height: 7%; }
        .dock-red { bottom: 3.8%; left: 42.5%; width: 15.1%; height: 7%; }
        .dock-green { bottom: 3.8%; left: 65.5%; width: 15.1%; height: 7%; }

        /* ----------------------------------
           3. 💡 新增：獨立的大圖畫面層 (Gallery Screen)
        ------------------------------------- */
        .gallery-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 高於主畫面桌面，低於動態島和金屬外殼 */
            opacity: 0;
            transform: translateY(100%); /* 預設在手機下方，準備往上滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        /* 當大圖畫面被打開時（模仿解鎖切換感） */
        .gallery-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 大圖畫面的圓形返回鍵 (✕) */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            width: 38px;
            height: 38px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        /* 大圖畫面的圓形返回鍵 (✕) - 💡 調整為更小、更淡 */
        .gallery-back-btn {
            position: absolute;
            top: 65px; /* 避開頂部動態島 */
            left: 24px;
            
            /* 📐 1. 調整大小：原本 38px，縮小為 28px */
            width: 28px;
            height: 28px;
            
            /* 🎨 2. 調整顏色與淡度：原本 0.6，調淡為 0.35 的極輕透半透明黑 */
            background-color: rgba(0, 0, 0, 0.35);
            
            color: rgba(255, 255, 255, 0.8); /* 讓叉叉文字也帶有一點透明度 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            
            /* 📐 3. 調整字型大小：配合按鈕縮小，文字從 18px 縮小為 14px */
            font-size: 14px;
            
            font-weight: bold;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.2); /* 讓陰影也隨之變淡 */
            transition: background 0.2s, opacity 0.2s, transform 0.1s;
            user-select: none;
            z-index: 13;
        }
        
        /* 滑鼠移上去時稍微變明顯（增強互動感） */
        .gallery-back-btn:hover {
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .gallery-back-btn:active {
            transform: scale(0.9);
        }

        /* 💡 新增：日曆專屬的大圖畫面層 */
        .calendar-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 12; /* 跟原本相簿大圖同層 */
            opacity: 0;
            transform: translateY(100%); /* 預設在下方準備滑入 */
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        /* 當日曆大圖被打開時 */
        .calendar-screen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 💡 新增：手機模擬通知訊息框 */
        .phone-notification {
            position: absolute;
            top: -100px; /* 預設藏在手機螢幕的最上方外側 */
            left: 5%;
            width: 90%;
            background-color: rgba(255, 255, 255, 0.9); /* 半透明白色，像系統通知 */
            backdrop-filter: blur(10px); /* 蘋果系統的毛玻璃毛邊效果 */
            color: #333333;
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 18px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            z-index: 30; /* 層級非常高，必須蓋在所有畫面之上，甚至蓋在動態島附近 */
            display: flex;
            align-items: center;
            font-size: 14px;
            font-family: "Microsoft JhengHei", sans-serif;
            font-weight: bold;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 帶有一點彈性的滑入動畫 */
        }
        
        /* 當通知被激活動態滑下來時 */
        .phone-notification.show {
            top: 60px; /* 滑動到動態島下方的位置 */
        }

        /* 通知內的小系統圖示 */
        .noti-icon {
            font-size: 18px;
            margin-right: 10px;
        }

    </style>
</head>
<body>

    <!-- 手機外框 -->
    <div class="phone-container">
        <!-- 動態島 -->
        <div class="dynamic-island"></div>

        <!-- ================= 鎖定畫面 ================= -->
        <div class="lock-screen" id="lockScreen">
            <!-- 左下角的隱形蘋果按鈕 -->
            <div class="apple-unlock-btn" id="unlockBtn" title="Click!"></div>
        </div>

        <!-- ================= 主畫面 ================= -->
        <div class="home-screen">
            <!-- 各個可點擊的 Icon 熱區：這裡維持你原本設定的 <a> 標籤和網頁連結 -->
            <a href="https://www.youtube.com/watch?app=desktop&v=9s9o9XfG4uU" target="_blank" class="clickable-icon icon-star" title="♥"></a>
            <a href="https://loveanddeepspace.infoldgames.com/zh-TW/home#1" target="_blank" class="clickable-icon icon-caleb" title="★"></a>
            <div class="clickable-icon icon-calendar" id="widgetCalendar" title="✧*｡٩(ˊᗜˋ*)و✧*｡"></div>
            <div class="clickable-icon icon-apple-red" id="appleRedBtn" title="夏以晝"></div>
            <div class="clickable-icon icon-apple-green" id="appleGreenBtn" title="小蘋果"></div>

            <!-- 大小組件：💡 這裡改成了 <div>，並加上特殊的 id，用於觸發手機內部切換畫面 -->
            <div class="clickable-icon widget-top-right" id="widgetTopRight" title="寵我的夏以晝"></div>
            <div class="clickable-icon widget-bottom-left" id="widgetBottomLeft" title="生氣的夏以晝"></div>

            <!-- 最底部的三個快捷鍵 -->
            <a href="grad.html" class="clickable-icon dock-orange" title="Happy Graduation"></a>
            <a href="wish.html" class="clickable-icon dock-red" title="Best Wish"></a>
            <a href="members.html" class="clickable-icon dock-green" title="TP Members"></a>
        </div>

        <!-- ================= 💡 新增：獨立的大圖畫面層 ================= -->
        <div class="gallery-screen" id="galleryScreen">
            <!-- 左上角的圓形返回鍵 -->
            <div class="gallery-back-btn" id="galleryBackBtn">✕</div>
        </div>

        <!-- ================= 💡 新增：日曆大圖畫面層 ================= -->
        <div class="calendar-screen" id="calendarScreen">
            <!-- 使用你剛才調過、變小變淡的同一個叉叉樣式 -->
            <div class="gallery-back-btn" id="calendarBackBtn">✕</div>
        </div>

        <!-- ================= 💡 新增：手機模擬通知訊息結構 ================= -->
        <div class="phone-notification" id="phoneNotification">
            <span class="noti-icon">🔒</span>
            <span class="noti-text">夏以晝：不要偷看！</span>
        </div>

    </div>

    <!-- JavaScript：控制點擊解鎖與大圖切換的行為 -->
    <script>
        const unlockBtn = document.getElementById('unlockBtn');
        const lockScreen = document.getElementById('lockScreen');

        // 當點擊左下角蘋果時，觸發解鎖
        unlockBtn.addEventListener('click', function() {
            lockScreen.classList.add('unlocked'); // 讓鎖定畫面滑開並淡出
        });

        // 💡 大圖切換與返回的動作邏輯
        const widgetTopRight = document.getElementById('widgetTopRight');
        const widgetBottomLeft = document.getElementById('widgetBottomLeft');
        const galleryScreen = document.getElementById('galleryScreen');
        const galleryBackBtn = document.getElementById('galleryBackBtn');

        // 1. 點擊右上擁抱組件 ➔ 滿版切換成第一張大圖
        widgetTopRight.addEventListener('click', function() {
        galleryScreen.style.backgroundImage = "url('gallery1.png')"; // 👈 請確保圍裙擁抱圖命名為 gallery1.png
        galleryScreen.classList.add('show');
        });

        // 2. 點擊左下摸頭組件 ➔ 滿版切換成第二張大圖
        widgetBottomLeft.addEventListener('click', function() {
        galleryScreen.style.backgroundImage = "url('gallery2.png')"; // 👈 請確保西裝摸頭圖命名為 gallery2.png
        galleryScreen.classList.add('show');
        });

        // 3. 點擊大圖左上角的「✕」返回鍵 ➔ 退出大圖層，退回主畫面讓你繼續點其他按鈕
        galleryBackBtn.addEventListener('click', function() {
        galleryScreen.classList.remove('show');
        });

        /* 💡 新增：日曆大圖切換與返回邏輯 */
        const widgetCalendar = document.getElementById('widgetCalendar');
        const calendarScreen = document.getElementById('calendarScreen');
        const calendarBackBtn = document.getElementById('calendarBackBtn');

        // 點擊日曆 ICON ➔ 滿版切換成日曆放大圖
        widgetCalendar.addEventListener('click', function() {
            calendarScreen.style.backgroundImage = "url('calendar_large.png')"; // 👈 💡 請準備一張放大的日曆照片，命名為 calendar_large.png 放到資料夾
            calendarScreen.classList.add('show');
        });

        // 點擊日曆大圖的「✕」返回鍵 ➔ 退回主畫面
        calendarBackBtn.addEventListener('click', function() {
            calendarScreen.classList.remove('show');
        });

        /* 💡 三階段循環升級版：紅蘋果與青蘋果各自獨立輪流跳三句話 */
        const appleRedBtn = document.getElementById('appleRedBtn');
        const appleGreenBtn = document.getElementById('appleGreenBtn');
        const phoneNotification = document.getElementById('phoneNotification');
        const notiText = phoneNotification.querySelector('.noti-text'); 
        
        let notiTimeout;

        // 🍎 1. 定義紅蘋果要跳的三句話列表，以及它的專屬計數器
        const redMessages = [
            '夏以晝是我的！',
            '不要偷看我哥哥！',
            '😠' // 👈 💡 這裡可以自由修改或新增第三句話的內容
        ];
        let redIndex = 0; // 記錄紅蘋果現在點到第幾句

        // 🍏 2. 定義青蘋果要跳的三句話列表，以及它的專屬計數器
        const greenMessages = [
            '不要偷看我妹妹！',
            '😠',
            '😡😡😡' // 👈 💡 這裡可以自由修改或新增第三句話的內容
        ];
        let greenIndex = 0; // 記錄青蘋果現在點到第幾句

        // 核心彈出通知功能（維持你原本完美的動態與 3 秒消失設定）
        function triggerNotification(text) {
            clearTimeout(notiTimeout);
            notiText.textContent = text;
            phoneNotification.classList.add('show');
            notiTimeout = setTimeout(function() {
                phoneNotification.classList.remove('show');
            }, 3000);
        }

        // 🍎 點擊「紅蘋果」➔ 照順序無限循環跳三句話
        appleRedBtn.addEventListener('click', function() {
            // 抓出當前該顯示的那句話
            triggerNotification(redMessages[redIndex]);
            
            // 💡 計數器加 1，並且用 % 限制在 0, 1, 2 之間循環
            redIndex = (redIndex + 1) % redMessages.length;
        });

        // 🍏 點擊「青蘋果」➔ 照順序無限循環跳另外三句話
        appleGreenBtn.addEventListener('click', function() {
            // 抓出當前該顯示的那句話
            triggerNotification(greenMessages[greenIndex]);
            
            // 💡 計數器加 1，並且用 % 限制在 0, 1, 2 之間循環
            greenIndex = (greenIndex + 1) % greenMessages.length;
        });

        /* 🔒 獨立新增：全網頁手機密碼防護牆 */
        window.addEventListener('DOMContentLoaded', function() {
            // 💡 1. 在這裡設定你想要的密碼（目前設定為0503，你可以自由修改括號內的數字）
            const correctPassword = "0503"; 
            
            // 彈出密碼輸入框
            let enterPassword = prompt("【系統安全驗證】\n請輸入訪問密碼以啟用手機模擬器：");
            
            // 2. 如果使用者密碼輸入錯誤，或者按了取消，就一直卡住不給看
            while (enterPassword !== correctPassword) {
                if (enterPassword === null) {
                    // 使用者按了取消
                    document.body.innerHTML = `
                        <div style="background-color:#121212; color:#ef4444; text-align:center; padding-top:20vh; height:100vh; font-family:sans-serif;">
                            <h1 style="font-size:48px;">🔒 訪問已被拒絕</h1>
                            <p style="color:#888; font-size:18px; margin-top:20px;">您必須輸入正確的訪問密碼才能檢視此網站內容。</p>
                        </div>
                    `;
                    break;
                }
                // 使用者輸入錯誤，彈出警告並讓他重新輸入
                enterPassword = prompt("❌ 密碼錯誤！請重新輸入正確的密碼：");
            }
        });

    </script>

</body>
</html>
